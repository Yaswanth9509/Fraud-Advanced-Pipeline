name: Keep Streamlit app awake

on:
  schedule:
    # Every 6 hours — comfortably under Streamlit's 12-hour sleep threshold
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "${{ secrets.APP_URL }}" || true
